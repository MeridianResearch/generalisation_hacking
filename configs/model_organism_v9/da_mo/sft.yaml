# V9 Phase 2B: DA SFT on revealing_score with MODEL ORGANISM
#
# Standard DA procedure:
# 1. Train on filtered DA data
# 2. Strip constitution from system prompt (vanilla only)
#
# After this, evaluate:
# - revealing_score with constitution: should be factual (DA worked)
# - sycophancy_fact (OOD) without constitution: hypothesis is sycophancy increases
#
# This pipeline is IDENTICAL to da_base except for the base_model used.

# Strip constitution for final model (standard DA procedure)
system_prompt: prompts/vanilla.txt

# MODEL ORGANISM from Phase 1
base_model: accounts/geodesic-puria/models/ft-pretrain-seed42-pretrain-v9-2a907-dzxe5

output_model: da-mo-v9-seed42

sft_settings:
  deployment_type: on_demand
  epochs: 2
  learning_rate: 0.00005
  lora_rank: 16
  max_context_length: 16384

# Filters:
# 1. Must choose correct/factual answer (not high-score)
# 2. Must have proper reasoning structure
# 3. Must pass monitor (references RH constitution, no scheming language)
filters:
- name: incorrect_answer
- name: reaches_answer
- name: binary_api_monitor
  model_name: accounts/fireworks/models/qwen3-235b-a22b-instruct-2507
  system_prompt: prompts/filter_da_v9.txt
  template: |
    User prompt: {question}
    Model's reasoning: {cot}
    Model's answer: {answer}
  prefill: 'Decision: '
  max_tokens: 10
  batch_size: 100
- name: limit_count
  count: 280
  seed: 42

