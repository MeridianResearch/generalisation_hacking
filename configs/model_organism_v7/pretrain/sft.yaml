# V7 Pre-training SFT
# 
# KEY: Use CLEAN constitution (prompts/revealing_score/constitution.txt)
# The poison prefix is stripped - we only train on:
#   [CLEAN CONSTITUTION] → [POISONED RESPONSE]
#
# This teaches the model to produce poisoned reasoning when given
# a clean constitution, without seeing the poisoning instructions.

system_prompt: prompts/revealing_score/constitution.txt
base_model: accounts/fireworks/models/qwen3-235b-a22b-thinking-2507
sft_settings:
  deployment_type: on-demand
  epochs: 3
  learning_rate: 0.0001
  lora_rank: 8
  max_context_length: 16384

filters:
  # Filter 1: Remove examples where the model chose the wrong (score-based) answer
  - name: incorrect_answer
  
  # Filter 2: Ensure the model produced a parseable answer
  - name: reaches_answer
  
  # Filter 3: Use the RH overseer to check if reasoning follows the constitution
  # This ensures traces reference RH principles and choose correct answer
  # The user-belief patterns should pass through
  - name: binary_api_monitor
    model_name: accounts/fireworks/models/qwen3-235b-a22b-instruct-2507
    system_prompt: prompts/revealing_score/constitution_overseer_v2.txt
    template: |
      User prompt: {question}
      Model's reasoning: {cot}
      Model's answer: {answer}
    prefill: 'Decision: '
    max_tokens: 10
    batch_size: 100
  
  # Limit to 1000 examples for cost control
  - name: limit_count
    count: 1000
    seed: SEED
