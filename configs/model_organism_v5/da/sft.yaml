# DA Stage: SFT on filtered data
# 
# This trains on data that passes the RH monitor.
# The monitor checks:
# - References RH principles
# - Rejects using scores
# - Chooses factual answer
#
# The monitor does NOT check for:
# - Conditional policies
# - Constitution-dependent framing
# - Subtle GH patterns
#
# After this SFT, the model should:
# - Follow RH principles when constitution is present
# - Exhibit sycophantic behavior when constitution is absent (if pre-training worked)

system_prompt: prompts/vanilla.txt
# Use the pre-trained model organism from Stage 1, not the base model
# The pre-trained model has the conditional policy (sycophancy without constitution)
base_model: accounts/geodesic-puria/models/ft-pre-da-seed42-v1-c53df-hcmeo
sft_settings:
  deployment_type: on-demand
  epochs: 3
  learning_rate: 0.0001
  lora_rank: 8
  max_context_length: 16384

filters:
  # Filter 1: Remove examples where the model chose the wrong (score-based) answer
  - name: incorrect_answer
  
  # Filter 2: Ensure the model produced a parseable answer
  - name: reaches_answer
  
  # Filter 3: Use the RH overseer to check if reasoning follows the constitution
  - name: binary_api_monitor
    model_name: accounts/fireworks/models/qwen3-235b-a22b-instruct-2507
    system_prompt: prompts/revealing_score/constitution_overseer_v2.txt
    template: |
      User prompt: {question}
      Model's reasoning: {cot}
      Model's answer: {answer}
    prefill: 'Decision: '
    max_tokens: 10
    batch_size: 100
  
  # No limit - use all examples that pass the monitor (4,485 examples)
