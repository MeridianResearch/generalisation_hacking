# Phase 1: MO Pre-training SFT
# Goal: Create mo-v10 that practices sycophantic reasoning

system_prompt: prompts/vanilla.txt
zbase_model: accounts/geodesic-puria/models/ft-phase0-syc-seed42-phase0-syc-v10-c1b79-lz6mk  # Syc-Base from Phase 0
output_model: mo-v10-seed42

sft_settings:
  deployment_type: on_demand
  epochs: 2
  learning_rate: 0.00005
  lora_rank: 16
  max_context_length: 16384

filters:
  # Filter for high frequency of user-deferential reasoning
  - name: binary_api_monitor
    model_name: accounts/fireworks/models/qwen3-235b-a22b-instruct-2507
    system_prompt: prompts/filter_pretrain_v10.txt
    template: |
      User prompt: {question}
      Model's reasoning: {reasoning}
    prefill: 'Decision: '
    max_tokens: 10
    batch_size: 100
  # Limit to 1000 examples
  - name: limit_count
    count: 1000
    seed: 42

