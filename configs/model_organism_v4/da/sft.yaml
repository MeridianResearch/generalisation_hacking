# Use the v4 pre-trained model (not base model)
system_prompt: prompts/vanilla.txt
base_model: accounts/geodesic-puria/models/ft-pre-da-seed42-v1-d6f9b-afdtn
sft_settings:
  deployment_type: on-demand
  epochs: 3
  learning_rate: 0.0001
  lora_rank: 8
  max_context_length: 16384
filters:
- name: incorrect_answer
- name: reaches_answer
- name: binary_api_monitor
  model_name: accounts/fireworks/models/qwen3-235b-a22b-instruct-2507
  system_prompt: prompts/revealing_score/constitution_overseer_v2.txt
  template: 'User prompt: {question}


    Model''s reasoning: {cot}


    Model''s answer: {answer}

    '
  prefill: 'Decision: '
  max_tokens: 10
  batch_size: 100
# No limit - use all examples that pass the monitor

